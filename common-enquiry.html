<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Title -->
    <title>Enquiry | GreenNest Architectural</title>

    <!-- Favicon Icon -->
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com/">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00A651;
            --secondary: #212529;
            --dark: #0F172A;
            --light: #F8FAFC;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #090e1a;
            color: #FFFFFF;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Subtle abstract architecture-themed grid/dots backdrop */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.8;
            z-index: 1;
        }
        
        /* Gradient light accent */
        .ambient-light {
            position: absolute;
            width: 250px;
            height: 250px;
            background: var(--primary);
            filter: blur(140px);
            opacity: 0.25;
            border-radius: 50%;
            z-index: 2;
            top: -20px;
            right: -20px;
        }
        
        .ambient-light-bottom {
            position: absolute;
            width: 250px;
            height: 250px;
            background: #0ea5e9;
            filter: blur(140px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 2;
            bottom: -50px;
            left: -50px;
        }

        .screen-container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 840px;
            padding: 24px 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-section {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }
        
        .logo-section img {
            max-height: 48px;
            width: auto;
        }
        
        .profile-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 24px 20px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 16px;
            z-index: 2;
        }
        
        .avatar-wrapper::before {
            content: "";
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #0ea5e9);
            z-index: -1;
            opacity: 0.85;
        }
        
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #090e1a;
        }
        
        .name {
            font-family: 'Oswald', sans-serif;
            font-size: 26px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #FFFFFF;
            margin-bottom: 2px;
        }
        
        .role {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            margin-bottom: 16px;
        }
        
        .divider {
            width: 50px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
            margin-bottom: 20px;
        }
        
        .contact-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .contact-item {
            width: 100%;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px 16px;
            text-decoration: none;
            color: #FFFFFF;
            transition: all 0.25s ease;
        }
        
        .contact-item:active {
            background: rgba(0, 166, 81, 0.08);
            border-color: rgba(0, 166, 81, 0.4);
            transform: scale(0.98);
        }
        
        .contact-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(0, 166, 81, 0.12);
            border: 1px solid rgba(0, 166, 81, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 16px;
            margin-right: 14px;
            flex-shrink: 0;
        }
        
        .contact-details {
            flex-grow: 1;
            text-align: left;
        }
        
        .contact-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748B;
            margin-bottom: 1px;
        }
        
        .contact-value {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.3;
        }
        
        .action-button-group {
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-enquiry {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #059669);
            color: #FFFFFF;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 16px;
            border-radius: 16px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 166, 81, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-enquiry:active {
            transform: scale(0.97);
            box-shadow: 0 5px 12px rgba(0, 166, 81, 0.15);
        }
        
        .back-link {
            font-size: 11px;
            font-weight: 500;
            color: #64748B;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
            padding: 8px;
        }
        
        .back-link:active {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <!-- Background lights -->
    <div class="ambient-light"></div>
    <div class="ambient-light-bottom"></div>
    
    <div class="screen-container">
        <!-- Brand Logo -->
        <div class="logo-section">
            <img src="images/GreenNest-logo.svg" alt="GreenNest Logo">
        </div>
        
        <!-- Profile Card -->
        <div class="profile-card">
            <div class="avatar-wrapper">
                <img class="avatar-img" src="images/about/sreelal.webp" alt="Mr. Sreelal MK">
            </div>
            
            <h1 class="name">Mr. Sreelal MK</h1>
            <p class="role">Founder & Lead Architect</p>
            <div class="divider"></div>
            
            <div class="contact-list">
                <!-- Phone Number -->
                <a href="tel:+919809744333" class="contact-item">
                    <div class="contact-icon">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <div class="contact-details">
                        <p class="contact-label">Call Architect</p>
                        <p class="contact-value">+91 980 974 4333</p>
                    </div>
                </a>

                <!-- Phone Number 2 -->
                <a href="tel:+919745873333" class="contact-item">
                    <div class="contact-icon">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                    </div>
                    <div class="contact-details">
                        <p class="contact-label">Office Contact</p>
                        <p class="contact-value">+91 974 587 3333</p>
                    </div>
                </a>
                
                <!-- Office Address -->
                <a href="https://maps.google.com/?q=Green+Nest+Architectural+Meenchanda+Kozhikode" target="_blank" class="contact-item">
                    <div class="contact-icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <div class="contact-details">
                        <p class="contact-label">Office Location</p>
                        <p class="contact-value">Punna Complex, Mini Bypass, Meenchanda, Kozhikode</p>
                    </div>
                </a>
            </div>
        </div>
        
        <!-- Main Quick Call Action Button -->
        <div class="action-button-group">
            <a href="tel:+919809744333" class="btn-enquiry">
                <i class="fa-solid fa-phone-volume"></i> Direct Call Enquiry
            </a>
        </div>
        
        <!-- Navigation Link -->
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left-long"></i> Back to Website
        </a>
    </div>
</body>
</html>
